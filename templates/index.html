<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ app_name }} — AI Comic Creator
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<main class="shell">

    <section class="hero">

        <div>

            <p class="eyebrow">
                GENERATIVE AI • COMIC CREATOR
            </p>

            <h1>
                ComicCraft
            </h1>

            <p>
                Turn one idea into a five-panel
                illustrated comic.
            </p>

        </div>

        <div class="badge">
            Gemini + Diffusion
        </div>

    </section>


    {% if error %}

    <div class="alert">
        {{ error }}
    </div>

    {% endif %}


    <form
        class="card form-grid"
        action="/generate"
        method="post"
        id="comic-form"
    >

        <label class="full">

            Story Prompt

            <textarea
                name="story_prompt"
                required
                maxlength="2000"
                placeholder="A brave fox exploring an enchanted forest..."
            ></textarea>

        </label>


        <label>

            Main Character Name

            <input
                type="text"
                name="character_name"
                required
                maxlength="100"
                placeholder="Fenn"
            >

        </label>


        <label>

            Setting

            <select name="setting">

                <option>
                    forest
                </option>

                <option>
                    school
                </option>

                <option>
                    space
                </option>

                <option>
                    city
                </option>

                <option>
                    underwater world
                </option>

            </select>

        </label>


        <label>

            Story Tone

            <select name="tone">

                <option>
                    light-hearted
                </option>

                <option>
                    dramatic
                </option>

                <option>
                    poetic
                </option>

                <option>
                    funny
                </option>

            </select>

        </label>


        <label>

            Art Style

            <select name="art_style">

                <option>
                    comic book
                </option>

                <option>
                    anime
                </option>

                <option>
                    pixel art
                </option>

                <option>
                    realistic
                </option>

            </select>

        </label>


        <div class="full actions">

            <button
                type="submit"
                class="primary"
            >
                ✨ Generate My Comic
            </button>

            <span id="status"></span>

        </div>

    </form>


    <section class="info-grid">

        <article>

            <strong>
                1. Outline
            </strong>

            <span>
                Five structured panels.
            </span>

        </article>


        <article>

            <strong>
                2. Story
            </strong>

            <span>
                Narration, captions and dialogue.
            </span>

        </article>


        <article>

            <strong>
                3. Art
            </strong>

            <span>
                One illustration per panel.
            </span>

        </article>


        <article>

            <strong>
                4. Export
            </strong>

            <span>
                Downloadable PDF.
            </span>

        </article>

    </section>

</main>


<script
    src="/static/js/app.js"
></script>

</body>

</html>
